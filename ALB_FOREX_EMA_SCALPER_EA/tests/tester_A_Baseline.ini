; ALB_FOREX_EMA_SCALPER_EA - Strategy Tester config, variant A_Baseline
; Run from a Windows command prompt (adjust the terminal path):
;   "C:\Program Files\MetaTrader 5\terminal64.exe" /config:"C:\path\to\tester_A_Baseline.ini"
; Before running:
;   1. Compile the EA (MetaEditor F7) so ALB_FOREX_EMA_SCALPER_EA.ex5 exists.
;   2. Copy presets\Backtest_A_Baseline.set to <Data Folder>\MQL5\Profiles\Tester\
;   3. Set Symbol= to your broker's gold symbol (XAUUSD, XAUUSD+, XAUUSDm ...).
;   4. Set Login= to your account number if the terminal is not already logged in.
; Dates: FromDate..ToDate = full period. ForwardMode=4 + ForwardDate splits it:
;   FromDate..ForwardDate = in-sample, ForwardDate..ToDate = out-of-sample (forward) test.
; Use the SAME dates for every variant so results are comparable.
[Tester]
Expert=ALB_FOREX_EMA_SCALPER_EA\ALB_FOREX_EMA_SCALPER_EA.ex5
ExpertParameters=Backtest_A_Baseline.set
Symbol=XAUUSD
Period=M1
Model=4
ExecutionMode=0
Optimization=0
FromDate=2025.11.01
ToDate=2026.10.31
ForwardMode=4
ForwardDate=2026.07.01
Deposit=10000
Currency=USD
Leverage=100
Visual=0
UseLocal=1
UseRemote=0
UseCloud=0
Report=ALBFX_EMA_SCALPER_A_Baseline
ReplaceReport=1
ShutdownTerminal=1
